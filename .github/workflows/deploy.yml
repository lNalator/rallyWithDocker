name: Deploy staging
# Même schéma que slopbattle-back : image sur GHCR, puis le runner de la VM relance la stack.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ghcr.io exige un nom d'image en minuscules
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: ./apps/web/Dockerfile
          context: .
          push: true
          build-args: |
            SELF_HOSTED=true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: image
    runs-on: [self-hosted, staging]
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /var/home/core/apps/rallly/app
    steps:
      - uses: actions/checkout@v4
      - name: Login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: |
          # APP_DIR est monté à l'identique dans le runner : la copie arrive sur l'hôte
          cp docker-compose.prod.yml "$APP_DIR/compose.yaml"
          cd "$APP_DIR"
          export RALLLY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker compose pull rallly
          docker compose up -d --remove-orphans
          docker image prune -f
      - name: Check health
        working-directory: /var/home/core/apps/rallly/app
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T rallly curl -fsS http://localhost:3000/api/status && exit 0
            sleep 5
          done
          docker compose logs --tail 50 rallly
          exit 1
